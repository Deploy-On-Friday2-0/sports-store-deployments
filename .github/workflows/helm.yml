name: Helm validation

on:
  pull_request:
    paths:
      - ".github/workflows/helm.yml"
      - "apps/sports-store-production.yaml"
      - "apps/root-app.yaml"
      - "apps/argo-rollouts.yaml"
      - "bootstrap/**"
      - "projects/**"
      - "environments/production/images/**"
      - "helm/sports-store/**"
      - "tests/dep-239.sh"
      - "tests/dep-238.sh"
  push:
    paths:
      - ".github/workflows/helm.yml"
      - "apps/sports-store-production.yaml"
      - "apps/root-app.yaml"
      - "apps/argo-rollouts.yaml"
      - "bootstrap/**"
      - "projects/**"
      - "environments/production/images/**"
      - "helm/sports-store/**"
      - "tests/dep-239.sh"
      - "tests/dep-238.sh"

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            printf 'Invalid branch name: %s\n' "$BRANCH_NAME"
            printf 'Use feature/, bugfix/, or hotfix/ followed by a lowercase kebab-case slug.\n'
            exit 1
          fi

  validate:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3
      - name: Add official Argo chart repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
      - name: Build chart dependencies
        working-directory: helm/sports-store
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build .
          for archive in charts/*.tgz; do
            tar -xzf "$archive" -C charts
          done
      - name: Lint chart
        working-directory: helm/sports-store
        run: |
          helm lint .
          helm lint . -f values-eks.yaml
      - name: Render chart
        working-directory: helm/sports-store
        run: |
          helm template sports-store . --namespace sports-store > /dev/null
          helm template sports-store . --namespace sports-store -f values-eks.yaml > /dev/null
      - name: Test rendered manifests
        working-directory: helm/sports-store
        run: helm unittest --strict .
      - name: Test controller bootstrap
        run: |
          bash tests/dep-238.sh
          bash tests/dep-239.sh
