name: Helm validation

on:
  pull_request:
    paths:
      - ".github/workflows/helm.yml"
      - "helm/sports-store/**"
  push:
    paths:
      - ".github/workflows/helm.yml"
      - "helm/sports-store/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.0.3
      - name: Build chart dependencies
        working-directory: helm/sports-store
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build .
          tar -xzf charts/mongodb-15.6.26.tgz -C charts
      - name: Lint chart
        working-directory: helm/sports-store
        run: |
          helm lint .
          helm lint . -f values-eks.yaml
      - name: Test rendered manifests
        working-directory: helm/sports-store
        run: helm unittest --strict .
