mongodb:
  # Enforce one ReplicaSet member per Availability Zone. All three members
  # remain Pending unless the cluster has eligible workers in three zones.
  topologyKey: topology.kubernetes.io/zone
  podAntiAffinityPreset: hard
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: mongodb
  persistence:
    enabled: true
    storageClass: ebs-gp3-retain
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  # The hard zone anti-affinity above forces the third member onto the least
  # loaded zone's node. The Bitnami chart default request of 250m plus the
  # 100m exporter exceeded the ~350m spare CPU there, leaving the member
  # Pending with "Insufficient cpu". 100m keeps the cluster schedulable on a
  # 2vCPU t3.medium while requests still reserve an effective amount.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  metrics:
    # The chart-pinned exporter tag no longer exists upstream. Use the
    # bitnamilegacy image (same pattern as the Redis exporter below).
    enabled: true
    image:
      repository: bitnamilegacy/mongodb-exporter
      tag: 0.47.0-debian-12-r1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 150m
        memory: 192Mi

redis:
  image:
    repository: bitnamilegacy/redis
    tag: 7.2.5-debian-12-r6
  replica:
    persistence:
      storageClass: ebs-gp3-retain
      size: 8Gi
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/redis-exporter
      tag: 1.58.0-debian-12-r7
  sentinel:
    image:
      repository: bitnamilegacy/redis-sentinel
      tag: 7.2.5-debian-12-r5
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    persistence:
      enabled: true
      storageClass: ebs-gp3-retain
      size: 8Gi

ingress:
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: "alb-sports-store"
    # Every backend exposes its health endpoint at /health; the AWS Load
    # Balancer Controller default of / returns 404 and marks targets unhealthy.
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Optional ACM certificate override - if omitted, ALB defaults to HTTP on port 80
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/abc-123"

services:
  gateway:
    enabled: false
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/gateway
  frontend:
    enabled: false
  # Backend services autoscale on CPU in production, where the metrics-server
  # EKS addon is provisioned (sports-store-infrastructure eks.tf). minReplicas
  # of 2 also gives each service baseline HA across nodes.
  auth:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/auth-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  catalog:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/catalog-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  cart:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/cart-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  order:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/order-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  payment:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/payment-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6

# NOTE: the shared backend ServiceMonitor is intentionally NOT enabled here.
# values-eks.yaml is shared by every DEP-248 production release, so enabling it
# globally would make all of them fight to own the single fixed-name resource.
# It is enabled in exactly one owning release (production-mongodb) instead.
# The MongoDB/Redis exporter monitors self-gate on <dep>.enabled +
# <dep>.metrics.enabled, so they render only in their owning release.

