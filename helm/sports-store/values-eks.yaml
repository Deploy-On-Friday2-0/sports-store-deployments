# EKS-specific values. The infrastructure-managed StorageClass must exist
# before this chart is installed; this chart does not install the EBS CSI
# Driver or create cluster-scoped storage resources.
mongodb:
  # Enforce one ReplicaSet member per Availability Zone. All three members
  # remain Pending unless the cluster has eligible workers in three zones.
  topologyKey: topology.kubernetes.io/zone
  podAntiAffinityPreset: hard
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: mongodb
  persistence:
    enabled: true
    storageClass: ebs-gp3-retain
    accessModes:
      - ReadWriteOnce
    size: 8Gi

redis:
  sentinel:
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    persistence:
      enabled: true
      storageClass: ebs-gp3-retain
      size: 8Gi

ingress:
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

