mongodb:
  # Enforce one ReplicaSet member per Availability Zone. All three members
  # remain Pending unless the cluster has eligible workers in three zones.
  topologyKey: topology.kubernetes.io/zone
  podAntiAffinityPreset: hard
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: mongodb
  persistence:
    enabled: true
    storageClass: ebs-gp3-retain
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  metrics:
    # The chart-pinned exporter tag no longer exists upstream. Keep MongoDB
    # available while metrics are repaired separately.
    enabled: false

redis:
  replica:
    persistence:
      storageClass: ebs-gp3-retain
      size: 8Gi
  metrics:
    enabled: true
  sentinel:
    persistentVolumeClaimRetentionPolicy:
      enabled: true
      whenScaled: Retain
      whenDeleted: Retain
    persistence:
      enabled: true
      storageClass: ebs-gp3-retain
      size: 8Gi

ingress:
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: "alb-sports-store"
    # Optional ACM certificate override - if omitted, ALB defaults to HTTP on port 80
    # alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:123456789012:certificate/abc-123"

services:
  gateway:
    enabled: false
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/gateway
  frontend:
    enabled: false
  # Backend services autoscale on CPU in production, where the metrics-server
  # EKS addon is provisioned (sports-store-infrastructure eks.tf). minReplicas
  # of 2 also gives each service baseline HA across nodes.
  auth:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/auth-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  catalog:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/catalog-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  cart:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/cart-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  order:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/order-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
  payment:
    image: 386689380284.dkr.ecr.us-east-1.amazonaws.com/payment-service
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6

# NOTE: the shared backend ServiceMonitor is intentionally NOT enabled here.
# values-eks.yaml is shared by every DEP-248 production release, so enabling it
# globally would make all of them fight to own the single fixed-name resource.
# It is enabled in exactly one owning release (production-mongodb) instead.
# The MongoDB/Redis exporter monitors self-gate on <dep>.enabled +
# <dep>.metrics.enabled, so they render only in their owning release.

