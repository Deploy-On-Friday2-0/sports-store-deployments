suite: Canary analysis gate contract (DEP-364)
release:
  name: sports-store-gateway
  namespace: sports-store
values:
  - ../values-eks.yaml
templates:
  - templates/deployment.yaml
  - templates/canary-analysis.yaml
  - templates/sports-store-servicemonitors.yaml
tests:
  - it: wires the shared AnalysisTemplate into the catalog Rollout as background analysis
    set:
      enabledServices: [catalog, order, auth]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/deployment.yaml
    documentSelector: {path: metadata.name, value: catalog}
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: spec.strategy.canary.analysis.templates[0].templateName
          value: sports-store-canary-analysis
      - equal:
          path: spec.strategy.canary.analysis.startingStep
          value: 1
      - contains:
          path: spec.strategy.canary.analysis.args
          content:
            name: service-name
            value: catalog
          any: true
      - contains:
          path: spec.strategy.canary.analysis.args
          content:
            name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
          any: true
      - contains:
          path: spec.strategy.canary.analysis.args
          content:
            name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          any: true

  - it: wires the shared AnalysisTemplate into the order Rollout with its own service name
    set:
      enabledServices: [catalog, order, auth]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/deployment.yaml
    documentSelector: {path: metadata.name, value: order}
    asserts:
      - isKind:
          of: Rollout
      - equal:
          path: spec.strategy.canary.analysis.templates[0].templateName
          value: sports-store-canary-analysis
      - contains:
          path: spec.strategy.canary.analysis.args
          content:
            name: service-name
            value: order
          any: true
      - contains:
          path: spec.strategy.canary.analysis.args
          content:
            name: canary-hash
            valueFrom:
              podTemplateHashValue: Canary
          any: true

  - it: soaks each canary weight step for 2 minutes so the analysis collects 4 checks
    set:
      enabledServices: [catalog]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/deployment.yaml
    documentSelector: {path: metadata.name, value: catalog}
    asserts:
      - equal:
          path: spec.strategy.canary.steps
          value:
            - {setWeight: 10}
            - {pause: {duration: 2m}}
            - {setWeight: 25}
            - {pause: {duration: 2m}}
            - {setWeight: 50}
            - {pause: {duration: 2m}}
            - {setWeight: 75}
            - {pause: {duration: 2m}}

  - it: keeps non-rollout services as plain Deployments even when analysis is enabled
    set:
      enabledServices: [catalog, order, auth]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/deployment.yaml
    documentSelector: {path: metadata.name, value: auth}
    asserts:
      - isKind:
          of: Deployment

  - it: renders no analysis block when canaryAnalysis is disabled
    set:
      enabledServices: [catalog]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: false}
    template: templates/deployment.yaml
    documentSelector: {path: metadata.name, value: catalog}
    asserts:
      - notExists:
          path: spec.strategy.canary.analysis

  - it: declares the hash args the Rollout must inject
    set:
      enabledServices: [catalog]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/canary-analysis.yaml
    asserts:
      - equal:
          path: spec.args
          value:
            - {name: service-name}
            - {name: canary-hash}
            - {name: stable-hash}

  - it: renders the regression ratio as the primary success-rate gate
    set:
      enabledServices: [catalog]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/canary-analysis.yaml
    asserts:
      - equal:
          path: spec.metrics[0].name
          value: success-rate-ratio
      - equal:
          path: spec.metrics[0].successCondition
          value: result[0] >= 0.995
      - equal:
          path: spec.metrics[0].requiredConsecutiveFailures
          value: 2
      - matchRegex:
          path: spec.metrics[0].provider.prometheus.query
          pattern: 'rollouts_pod_template_hash="\{\{args.canary-hash\}\}"[\s\S]*rollouts_pod_template_hash="\{\{args.stable-hash\}\}"'
      - matchRegex:
          path: spec.metrics[0].provider.prometheus.query
          pattern: 'status=~"2xx\|3xx"'

  - it: renders the absolute success-rate floor as a backstop metric
    set:
      enabledServices: [catalog]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/canary-analysis.yaml
    asserts:
      - equal:
          path: spec.metrics[1].name
          value: success-rate-floor
      - equal:
          path: spec.metrics[1].successCondition
          value: result[0] >= 0.99
      - equal:
          path: spec.metrics[1].requiredConsecutiveFailures
          value: 2
      - matchRegex:
          path: spec.metrics[1].provider.prometheus.query
          pattern: 'rollouts_pod_template_hash="\{\{args.canary-hash\}\}".*status=~"2xx\|3xx"'

  - it: renders the canary-only absolute latency gate
    set:
      enabledServices: [catalog]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
    template: templates/canary-analysis.yaml
    asserts:
      - equal:
          path: spec.metrics[2].name
          value: latency
      - equal:
          path: spec.metrics[2].successCondition
          value: result[0] < 0.250
      - matchRegex:
          path: spec.metrics[2].provider.prometheus.query
          pattern: 'rollouts_pod_template_hash="\{\{args.canary-hash\}\}"'
      - equal:
          path: spec.metrics[2].provider.prometheus.address
          value: http://prometheus-operated.monitoring.svc.cluster.local:9090

  - it: does not render the AnalysisTemplate when the release does not own it
    set:
      enabledServices: [catalog, order]
      platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true, createAnalysisTemplate: false}
    template: templates/canary-analysis.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: transfers the ReplicaSet hash label onto scraped series for the gate queries
    template: templates/sports-store-servicemonitors.yaml
    set:
      mongodb.enabled: false
      redis.enabled: false
      monitoring.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/part-of: sports-store
      - equal:
          path: spec.endpoints[0].port
          value: http-metrics
      - contains:
          path: spec.podTargetLabels
          content: rollouts-pod-template-hash
