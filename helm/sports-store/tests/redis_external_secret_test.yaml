suite: Redis ExternalSecret ownership contract
release:
  name: sports-store
  namespace: sports-store
templates:
  - templates/redis-external-secret.yaml
  - templates/deployment.yaml
tests:
  - it: renders the dedicated redis ExternalSecret only when redis is enabled
    template: templates/redis-external-secret.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: sports-store-redis-secrets
      - equal:
          path: spec.secretStoreRef.name
          value: aws-secrets-manager
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - exists:
          path: spec.target.template.data.redis-password
      - contains:
          path: spec.data
          content:
            secretKey: redisPassword
            remoteRef:
              key: sports-store/production/config
              property: REDIS_PASSWORD

  - it: is not rendered when redis is disabled (single-owner contract)
    template: templates/redis-external-secret.yaml
    set:
      redis:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes the redis password to auth from the dedicated Secret
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sports-store-redis-secrets
                key: redis-password
                optional: true
