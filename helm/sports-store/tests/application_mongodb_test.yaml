suite: Application MongoDB connectivity
release:
  name: sports-store
  namespace: sports-store
templates:
  - templates/deployment.yaml
  - templates/external-secret.yaml
tests:
  - it: synchronizes ReplicaSet credentials and a discovery URI from AWS
    template: templates/external-secret.yaml
    asserts:
      - equal:
          path: spec.target.name
          value: sports-store-app-secrets
      - exists:
          path: spec.target.template.data.mongodb-replica-set-key
      - matchRegex:
          path: spec.target.template.data.MONGO_URI
          pattern: '@sports-store-mongodb-headless:27017/\?authSource=admin&replicaSet=rs0$'
      - contains:
          path: spec.data
          content:
            secretKey: mongoReplicaSetKey
            remoteRef:
              key: sports-store/production/config
              property: MONGODB_REPLICA_SET_KEY

  - it: references the externally managed ReplicaSet URI
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: auth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: sports-store-app-secrets
                key: MONGO_URI

  - it: provides the ReplicaSet URI to catalog
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: catalog
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: sports-store-app-secrets
                key: MONGO_URI

  - it: provides the ReplicaSet URI to cart
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: cart
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: sports-store-app-secrets
                key: MONGO_URI

  - it: provides the ReplicaSet URI to order
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: order
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: sports-store-app-secrets
                key: MONGO_URI

  - it: provides the ReplicaSet URI to payment
    template: templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: payment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: sports-store-app-secrets
                key: MONGO_URI
