# Key names: JWT_SECRET and MONGO_URI are injected into the 5 backend
# Deployments via secretKeyRef (see deployment.yaml). mongodb-root-password
# is the exact key name the Bitnami mongodb subchart's auth.existingSecret
# expects (see values.yaml's mongodb.auth.existingSecret).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sports-store.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc }}
  mongodb-root-password: {{ .Values.secrets.mongoRootPassword | b64enc }}
  MONGO_URI: {{ printf "mongodb://root:%s@%s:27017/?authSource=admin" .Values.secrets.mongoRootPassword (include "sports-store.mongoHost" .) | b64enc }}
