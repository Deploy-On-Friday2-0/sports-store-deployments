{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (has $name $.Values.enabledServices) $svc.autoscaling $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sports-store.selectorLabels" $name | nindent 4 }}
    {{- include "sports-store.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: {{ if or (eq $name "catalog") (eq $name "order") }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ if or (eq $name "catalog") (eq $name "order") }}Rollout{{ else }}Deployment{{ end }}
    name: {{ $name }}
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
    {{- if $svc.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
