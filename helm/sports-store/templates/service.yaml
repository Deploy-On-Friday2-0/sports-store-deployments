# ClusterIP Service per microservice, ranged over the same .Values.services
# map as deployment.yaml. Names stay unprefixed — see _helpers.tpl.
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sports-store.selectorLabels" $name | nindent 4 }}
    {{- include "sports-store.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "sports-store.selectorLabels" $name | nindent 4 }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      {{- if $svc.metrics }}
      name: http-metrics
      {{- end }}
{{- if or (eq $name "catalog") (eq $name "order") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-canary
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sports-store.selectorLabels" $name | nindent 4 }}
    {{- include "sports-store.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "sports-store.selectorLabels" $name | nindent 4 }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      {{- if $svc.metrics }}
      name: http-metrics
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
