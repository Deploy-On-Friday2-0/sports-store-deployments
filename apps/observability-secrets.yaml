# DEP-270 (Sub-PRD 7 2.3.1). Argo CD Application that reconciles the
# ExternalSecret manifests under secrets/observability/ into the monitoring
# namespace. Uses the sports-store-project AppProject — ExternalSecret and the
# monitoring destination are both permitted by its whitelist, and the target
# Secrets are created out-of-band by ESO (not Git-managed).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: observability-secrets
    app.kubernetes.io/part-of: sports-store
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: secrets/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
