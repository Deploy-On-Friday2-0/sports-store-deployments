apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus-stack
    app.kubernetes.io/part-of: sports-store
spec:
  # Third-party charts sit in the built-in `default` project (same pattern as
  # apps/kubecost); the sports-store-project AppProject is deliberately locked
  # to the deployments repo + argo-helm and must not be widened.
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.1.2
    helm:
      releaseName: prometheus-stack
      values: |
        # AC 2.1.1.2 - Grafana sidecar dashboard discovery.
        # Auto-imports any ConfigMap labeled `grafana_dashboard: "1"` from every
        # namespace, so app teams (and the canary AnalysisTemplate work in
        # Sub-PRD 6) can ship dashboards as ConfigMaps without touching Grafana.
        grafana:
          # DEP-270 - admin credentials come from the grafana-admin Secret that
          # ESO syncs from AWS Secrets Manager; no plaintext password in Git.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true

        # AC 2.1.1.3 - Prometheus persistence on the Amazon EBS CSI gp3
        # StorageClass provisioned by Terraform (kubernetes/storageclasses/
        # ebs-gp3-retain.yaml). That class sets volumeBindingMode:
        # WaitForFirstConsumer, so the PV is created in the pod's AZ.
        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ebs-gp3-retain
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi

        # DEP-270 - route alerts to Slack. The webhook URL is mounted from the
        # alertmanager-slack Secret (synced from AWS Secrets Manager by ESO) and
        # read via api_url_file, so no plaintext webhook lives in Git.
        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-slack
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              receiver: slack-notifications
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
              - name: slack-notifications
                slack_configs:
                  - channel: "#sports-store-alerts"
                    send_resolved: true
                    api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack-webhook-url
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
