apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/part-of: sports-store
spec:
  project: default
  source:
    repoURL: https://kubecost.github.io/cost-analyzer/
    chart: cost-analyzer
    targetRevision: 2.8.7
    helm:
      releaseName: kubecost
      values: |
        global:
          prometheus:
            # DEP-319 - Kubecost consumes the core kube-prometheus-stack
            # Prometheus (release `prometheus-stack`, namespace `monitoring`)
            # instead of bundling its own. The bundled Prometheus block below is
            # therefore removed.
            enabled: false
            fqdn: http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090
          grafana:
            enabled: false

        # DEP-319 - let the core Prometheus Operator scrape Kubecost's own
        # cost-model metrics and load its recording rules. kube-prometheus-stack
        # only selects ServiceMonitors/PrometheusRules labelled
        # `release: prometheus-stack`, so that label is added here.
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: prometheus-stack
          networkCosts:
            enabled: false
        prometheusRule:
          enabled: true
          additionalLabels:
            release: prometheus-stack

        kubecostProductConfigs:
          clusterName: sports-store-cluster
          defaultIdle: true
          sharedNamespaces: "kube-system,kubecost"
          shareTenancyCosts: true

        kubecostFrontend:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

        kubecostModel:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi

        kubecostAggregator:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          cloudCost:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 512Mi

        forecasting:
          enabled: false

        persistentVolume:
          enabled: true
          size: 10Gi
          # Omit storageClass to use the cluster's default StorageClass.
          # storageClass: verified-storage-class

        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: kubecost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
