apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8sgpt-secrets
  namespace: k8sgpt-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: k8sgpt-secrets
    creationPolicy: Owner
  data:
    - secretKey: google-api-key
      remoteRef:
        key: sports-store/production/config
        property: GOOGLE_API_KEY
    - secretKey: slack-webhook-url
      remoteRef:
        key: sports-store/production/config
        property: SLACK_WEBHOOK_URL
---
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-default
  namespace: k8sgpt-operator
spec:
  version: v0.4.36
  ai:
    enabled: true
    model: gemini-2.5-flash
    backend: google
    secret:
      name: k8sgpt-secrets
      key: google-api-key
  noCache: false
  targetNamespace: default
  analysis:
    interval: 2m
  filters:
    - Pod
    - Ingress
    - Service
    - Deployment
  sink:
    type: slack
    # DEP-360: dedup marker for the operator - the real webhook URL is provided by the
    # secret below. The operator writes this value into Result.status.webhook to dedupe
    # notifications (it never posts to it while the secret is set), so it must be
    # non-empty and constant or the operator re-emits every reconcile.
    webhook: placeholder-dep-360
    secret:
      name: k8sgpt-secrets
      key: slack-webhook-url
---
