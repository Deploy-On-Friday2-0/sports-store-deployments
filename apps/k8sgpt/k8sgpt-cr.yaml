apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8sgpt-secrets
  namespace: k8sgpt-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: k8sgpt-secrets
    creationPolicy: Owner
  data:
    - secretKey: google-api-key
      remoteRef:
        key: sports-store/production/config
        property: GOOGLE_API_KEY
    - secretKey: slack-webhook-url
      remoteRef:
        key: sports-store/production/config
        property: SLACK_WEBHOOK_URL
---
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-default
  namespace: k8sgpt-operator
spec:
  ai:
    enabled: true
    model: gemini-1.5-flash
    backend: google
    secret:
      name: k8sgpt-secrets
      key: google-api-key
  noCache: false
  targetNamespace: default
  analysis:
    interval: 30s
  filters:
    - Pod
    - Event
    - Ingress
    - Service
    - Deployment
  sink:
    type: slack
    secret:
      name: k8sgpt-secrets
      key: slack-webhook-url
---
