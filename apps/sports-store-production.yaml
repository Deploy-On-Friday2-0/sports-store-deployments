        ingress: {enabled: false}
        # canaryAnalysis: true wires the background AnalysisRun (success-rate
        # >= 99.5%, p95 latency < 250ms) into the order Rollout.
        # createAnalysisTemplate: false — the shared AnalysisTemplate object is
        # owned by production-catalog-service; setting this false prevents a
        # duplicate resource that would cause a Helm ownership conflict.
        platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true, createAnalysisTemplate: false}
        mongodb: {enabled: false}
        redis: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: sports-store}
