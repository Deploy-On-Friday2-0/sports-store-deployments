# DEP-248 production App-of-Apps children. The independently declared
# Argo Rollouts controller runs in wave -3, before these database Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-mongodb
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: helm/sports-store
    helm:
      releaseName: sports-store-mongodb
      valueFiles: [values-eks.yaml]
      values: |
        enabledServices: []
        ingress: {enabled: false}
        redis: {enabled: false}
        # Single owner of the shared platform-wide backend ServiceMonitor
        # (this release already owns the other platform singletons).
        monitoring: {serviceMonitor: {enabled: true}}
  destination: {server: https://kubernetes.default.svc, namespace: sports-store}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ApplyOutOfSyncOnly=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-redis-sentinel
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: helm/sports-store
    helm:
      releaseName: sports-store-redis-sentinel
      valueFiles: [values-eks.yaml]
      values: |
        enabledServices: []
        platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: false}
        ingress: {enabled: false}
        mongodb: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: sports-store}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
---
# Each backend Application selects one workload from the repository's existing
# parent chart. This avoids duplicate resource ownership while preserving the
# image value-file promotion contract.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: production-auth-service, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: helm/sports-store
    helm:
      releaseName: sports-store-auth
      valueFiles: [values-eks.yaml, ../../environments/production/images/auth-service.yaml]
      values: |
        enabledServices: [auth]
        ingress: {enabled: false}
        platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: false}
        mongodb: {enabled: false}
        redis: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: sports-store}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
