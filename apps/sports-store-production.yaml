---
# The legacy nginx gateway workload was removed (frontend moved
# out-of-cluster to CloudFront). This Application owns only the shared
# ALB Ingress that routes /api/* to the backend services. The release
# is named sports-store-ingress; fullnameOverride pins the Ingress to
# its historical name (sports-store-gateway) so the existing ALB is
# adopted instead of recreated (CloudFront's /api/* origin targets that
# ALB's DNS name).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: production-ingress, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "1"}}
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: helm/sports-store
    helm:
      releaseName: sports-store-ingress
      valueFiles: [values-eks.yaml]
      values: |
        fullnameOverride: sports-store-gateway
        enabledServices: []
        ingressServices: [auth, catalog, cart, order, payment]
        platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: false, createAnalysisTemplate: false}
        mongodb: {enabled: false}
        redis: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: sports-store}
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      jqPathExpressions:
        - .metadata.annotations."alb.ingress.kubernetes.io/actions.catalog"
        - .metadata.annotations."alb.ingress.kubernetes.io/actions.order"
        - .metadata.annotations."rollouts.argoproj.io/managed-alb-annotations"
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
