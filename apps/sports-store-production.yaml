apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: production-catalog-service, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: helm/sports-store
    helm:
      releaseName: sports-store-catalog
      valueFiles: [values-eks.yaml, ../../environments/production/images/catalog-service.yaml]
      values: |
        enabledServices: [catalog]
        fullnameOverride: sports-store-gateway
        ingress: {enabled: false}
        # canaryAnalysis: true deploys the AnalysisTemplate (success-rate >= 99.5%,
        # p95 latency < 250ms) and wires it as a background analysis on the catalog
        # Rollout. The analysis starts at 10% weight and aborts the rollout if
        # either SLO is breached — driven by real Prometheus traffic data.
        platform: {externalSecret: false, mongodbInit: false, canaryAnalysis: true}
        mongodb: {enabled: false}
        redis: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: sports-store}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
---
