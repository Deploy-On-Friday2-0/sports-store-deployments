apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8sgpt-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: k8sgpt-operator
    app.kubernetes.io/part-of: sports-store
spec:
  project: default
  source:
    repoURL: https://charts.k8sgpt.ai/
    chart: k8sgpt-operator
    targetRevision: 0.2.27
  destination:
    server: https://kubernetes.default.svc
    namespace: k8sgpt-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
