apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: sports-store
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.5.0
    helm:
      releaseName: loki
      values: |
        # Single-binary mode must be explicit; otherwise the chart keeps its
        # default simple-scalable replicas AND singleBinary.replicas, and its
        # own validation aborts the render.
        deploymentMode: SingleBinary
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          # The chart refuses to render without a schema_config.
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 20Gi
            # Chart key is storageClass (storageClassName is ignored here), so
            # the PVC now actually binds to the gp3 class.
            storageClass: ebs-gp3-retain
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: sports-store
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.3.0
    helm:
      releaseName: alloy
      values: |
        alloy:
          stabilityLevel: experimental
          configMap:
            create: true
            content: |
              logging {
                level = "info"
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  action = "replace"
                  target_label = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  action = "replace"
                  target_label = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "__path__"
                  separator = "/"
                  replacement = "/var/log/pods/*$1/*.log"
                }
              }

              loki.source.file "pod_logs" {
                targets = discovery.relabel.pod_logs.output
                forward_to = [loki.process.log_parsing.receiver]
              }

              loki.process "log_parsing" {
                forward_to = [loki.secretfilter.redact_secrets.receiver]

                stage.json {
                  expressions = {
                    level = "level",
                    service = "service",
                    trace_id = "trace_id"
                  }
                }

                stage.labels {
                  values = {
                    level = "",
                    service = "",
                    trace_id = ""
                  }
                }
              }

              loki.secretfilter "redact_secrets" {
                forward_to = [loki.write.loki.receiver]
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
