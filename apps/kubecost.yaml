# DEP-319. Argo CD Application that reconciles the apps/kubecost/ directory.
# The Kubecost Application manifest lives in that subdirectory; the root app
# only scans apps/*.yaml at the top level (recurse: false), so it was never
# synced on a fresh cluster. Uses the built-in `default` project because the
# chart sources from kubecost.github.io, which is not in the locked
# sports-store-project.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/part-of: sports-store
spec:
  project: default
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: apps/kubecost
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
