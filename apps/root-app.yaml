apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-store-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: sports-store-root
    app.kubernetes.io/part-of: sports-store
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
