apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-store-production-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sports-store
spec:
  project: sports-store-project
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
      include: '*.yaml'
      # Exclude the root Application itself; otherwise the '*.yaml' glob makes
      # it manage its own manifest (self-ownership loop).
      exclude: 'root-app.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
