# DEP-262 (Sub-PRD 7 2.1). Argo CD Application that reconciles the
# apps/monitoring/ directory. The kube-prometheus-stack Application manifest
# lives in that subdirectory; the root app only scans apps/*.yaml at the top
# level (recurse: false), so it was never synced on a fresh cluster. Uses the
# built-in `default` project because the child chart sources from
# prometheus-community, which is not in the locked sports-store-project.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: sports-store
spec:
  project: default
  source:
    repoURL: https://github.com/Deploy-On-Friday2-0/sports-store-deployments.git
    targetRevision: main
    path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
