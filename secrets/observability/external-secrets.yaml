# DEP-270 (Sub-PRD 7 2.3.1) - dynamic secret syncing for the observability /
# AI stack. Every value is fetched from AWS Secrets Manager
# (sports-store/production/observability) by the External Secrets Operator
# through the aws-secrets-manager ClusterSecretStore, which authenticates via
# EKS Pod Identity / IRSA (external-secrets-sa, permitted to read sports-store/*).
# No secret material lives in Git — only references (AC 2.3.1).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: sports-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
  # Keys admin-user / admin-password match kube-prometheus-stack's Grafana
  # `admin.existingSecret` convention.
  data:
    - secretKey: admin-user
      remoteRef:
        key: sports-store/production/observability
        property: GRAFANA_ADMIN_USER
    - secretKey: admin-password
      remoteRef:
        key: sports-store/production/observability
        property: GRAFANA_ADMIN_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: sports-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: sports-store/production/observability
        property: SLACK_WEBHOOK_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-backend
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: sports-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-backend
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
  data:
    - secretKey: api-key
      remoteRef:
        key: sports-store/production/observability
        property: AI_BACKEND_API_KEY
