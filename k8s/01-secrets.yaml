# Placeholder dev credentials for a local cluster — rotate before any
# non-local use. Values below are base64-encoded plaintext, not encrypted;
# anyone with `get secret -o yaml` access can trivially decode them.
#
#   JWT_SECRET             -> dev-secret-change-me
#   mongodb-root-password  -> dev-mongo-pw-change-me
#     (key name required by the Bitnami MongoDB chart's auth.existingSecret)
#   MONGO_URI               -> mongodb://root:dev-mongo-pw-change-me@mongodb:27017/?authSource=admin
#     (shared by all 5 backend services; each picks its own database by name
#     in code — see services/*/database.py — so one connection string works
#     for all of them, same as Stage 2's docker-compose.yml)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sports-store
type: Opaque
data:
  JWT_SECRET: ZGV2LXNlY3JldC1jaGFuZ2UtbWU=
  mongodb-root-password: ZGV2LW1vbmdvLXB3LWNoYW5nZS1tZQ==
  MONGO_URI: bW9uZ29kYjovL3Jvb3Q6ZGV2LW1vbmdvLXB3LWNoYW5nZS1tZUBtb25nb2RiOjI3MDE3Lz9hdXRoU291cmNlPWFkbWlu
