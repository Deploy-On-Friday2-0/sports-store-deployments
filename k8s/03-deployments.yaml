# Deployment manifests for all 7 microservices, using the :v1.0.0 images
# built directly into the sports-store Minikube profile's Docker daemon (see
# ../README.md / k8s/README.md "Local images"). imagePullPolicy: IfNotPresent
# on every container — these images were never pushed to a registry, so
# Always would try to pull from Docker Hub and fail.
#
# securityContext on every container: runAsNonRoot, a fixed non-root UID
# (10001), and allowPrivilegeEscalation: false — matches the USER 10001 each
# image already runs as (see each service repo's Dockerfile), so this is
# enforcing what's already true, not fighting the image.
#
# readinessProbe/livenessProbe hit each service's real /health endpoint on
# its real listening port (8001-8005 for the backends, 80 for frontend and
# gateway) — there is no /api/v1/health path or port 3000 anywhere in this
# codebase. Backends' /health does not itself check MongoDB connectivity
# (see services/*/main.py); each service's MongoDB client already retries
# lazily per-request (see services/*/database.py), so there's no
# initContainer gating startup on Mongo here — a request that arrives before
# Mongo is reachable fails and self-heals on the next one, which is the same
# behavior already verified in Stage 2's docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sports-store
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sports-store-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sports-store
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: sports-store-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: sports-store-app-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: sports-store
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: sports-store-auth-service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "60"
          envFrom:
            - secretRef:
                name: sports-store-app-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
