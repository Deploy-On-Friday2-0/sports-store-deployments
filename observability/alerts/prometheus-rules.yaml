# DEP-266 (Sub-PRD 7 2.2.1) - Prometheus alerting rules for the Sports Store
# platform. Delivered as a PrometheusRule CRD; the `release: prometheus-stack`
# label lets the DEP-262 kube-prometheus-stack Prometheus discover it under its
# default selector (ruleSelectorNilUsesHelmValues=true).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sports-store-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: sports-store
    release: prometheus-stack
spec:
  groups:
    - name: sports-store.availability
      rules:
        - alert: ServiceDown
          # A scrape target in the sports-store namespace has been unreachable.
          expr: up{namespace="sports-store"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Service target {{ $labels.job }} is down"
            description: "{{ $labels.job }} ({{ $labels.pod }}) has been unreachable for more than 2 minutes."

        - alert: PodCrashLooping
          # More than 5 container restarts within a 10-minute window.
          expr: increase(kube_pod_container_status_restarts_total{namespace="sports-store"}[10m]) > 5
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted more than 5 times in 10 minutes."

        - alert: ReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="sports-store"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} has had unavailable replicas for more than 5 minutes."

    - name: sports-store.traffic
      rules:
        - alert: HighHTTPErrorRate
          # >5% of responses are 5xx over a 5-minute window (grouped status label
          # from prometheus-fastapi-instrumentator, e.g. status="5xx").
          expr: |
            sum by (job) (rate(http_requests_total{status="5xx"}[5m]))
              /
            sum by (job) (rate(http_requests_total[5m]))
              > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate for {{ $labels.job }}"
            description: "{{ $labels.job }} has served more than 5% 5xx responses over the last 5 minutes."
